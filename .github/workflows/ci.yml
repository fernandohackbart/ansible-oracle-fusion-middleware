---
name: ci

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible-core: "2.20.11"
            python: "3.12"
          - ansible-core: "2.21.6"
            python: "3.12"
          - ansible-core: "2.22.0"
            python: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==${{ matrix.ansible-core }}" ansible-lint yamllint molecule
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check
        run: make syntax

      - name: YAML lint
        run: make yamllint

      - name: Molecule syntax scenario
        if: matrix.ansible-core == '2.21.6'
        run: make molecule

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Ansible lint
        run: make lint
