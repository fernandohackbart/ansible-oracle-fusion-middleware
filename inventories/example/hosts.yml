---
# Example inventory for local review and syntax checks.
# Replace the documentation IPs with real hosts. Groups are intentionally
# separated so domain creation can run once on the admin host while managed
# servers are configured per host.
all:
  children:
    ofm_admin:
      hosts:
        ofm-admin-01:
          ansible_host: 192.0.2.10
          ofm_admin_host: 192.0.2.10
    ofm_managed:
      hosts:
        ofm-ms-01:
          ansible_host: 192.0.2.11
          ofm_managed_host: 192.0.2.11
        ofm-ms-02:
          ansible_host: 192.0.2.12
          ofm_managed_host: 192.0.2.12
    ofm_forms:
      hosts:
        ofm-forms-01:
          ansible_host: 192.0.2.13
          ofm_forms_host: 192.0.2.13
    ofm_ohs:
      hosts:
        ofm-ohs-01:
          ansible_host: 192.0.2.14
          ofm_ohs_host: 192.0.2.14
  vars:
    ansible_user: oracle
    ansible_python_interpreter: /usr/bin/python3.9
