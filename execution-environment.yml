---
version: 3

images:
  base_image:
    name: quay.io/rockylinux/rockylinux:9

dependencies:
  ansible_core:
    package_pip: ansible-core==2.21.6
  ansible_runner:
    package_pip: ansible-runner
  galaxy:
    collections:
      - name: community.general
        version: "==14.0.1"
      - name: ansible.posix
        version: "==2.2.2"
  python:
    - pyyaml
  system:
    - git
    - openssh-clients
    - sshpass

options:
  package_manager_path: /usr/bin/dnf
