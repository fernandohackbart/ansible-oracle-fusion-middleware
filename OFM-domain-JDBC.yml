# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Oracle Fusion Middleware 12.2 base domain integrated with JDBC datasource
  hosts: ofm_admin
  remote_user: "{{ ansible_user | default('oracle') }}"
  become: true
  become_user: "{{ ofm_user | default('oracle') }}"
  become_method: ansible.builtin.sudo
  roles:
    - ofm-jdbc-datasource
