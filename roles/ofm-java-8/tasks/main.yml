##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---

- name: Checking serverEnvironment = {{ serverEnvironment }}
  ansible.builtin.fail:
    msg: "serverEnvironment = {{ serverEnvironment }} not valid!"
  when: >
    ((not (serverEnvironment in highenvs)) and (not(serverEnvironment in lowenvs)))

- name: Check if java home {{ javaHome }} is already installed
  ansible.builtin.stat:
    path: "{{ javaHome }}"
  register: javahome_installed

- name: Installing Java
  when: >
    not javahome_installed.stat.exists
  block:
    - name: Find the mount for {{ tempBaseVolume }}
      ansible.builtin.set_fact:
        ofm_temp_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', tempBaseVolume) | list | first | default({}) }}"

    - name: Assert sufficient space on {{ tempBaseVolume }}
      ansible.builtin.assert:
        that:
          - ofm_temp_mount | length > 0
          - ofm_temp_mount.size_available | default(0) > tempRequiredSpace
        fail_msg: >-
          Mount {{ tempBaseVolume }} was not found or has less than
          {{ tempRequiredSpace }} bytes available.
        quiet: true

    - name: Find the mount for {{ javaBaseVolume }}
      ansible.builtin.set_fact:
        ofm_java_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', javaBaseVolume) | list | first | default({}) }}"

    - name: Assert sufficient space on {{ javaBaseVolume }}
      ansible.builtin.assert:
        that:
          - ofm_java_mount | length > 0
          - ofm_java_mount.size_available | default(0) > javaRequiredSpace
        fail_msg: >-
          Mount {{ javaBaseVolume }} was not found or has less than
          {{ javaRequiredSpace }} bytes available.
        quiet: true

    - name: Create base folder {{ javaBaseHome }}
      ignore_errors: true
      ansible.builtin.file:
        path: "{{ javaBaseHome }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create stage folder {{ stageDir }}
      ansible.builtin.file:
        path: "{{ stageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Pre clean {{ stageDir }}/{{ javaInstallationFile }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ javaInstallationFile }}"
        state: absent

    - name: Download Java from {{ mediasURL }}/{{ javaInstallationFile }} to {{ stageDir }}/{{ javaInstallationFile }}
      ansible.builtin.get_url:
        url: "{{ mediasURL }}/{{ javaInstallationFile }}"
        dest: "{{ stageDir }}/{{ javaInstallationFile }}"
        checksum: "{{ javaInstallationFileChecksum | default(omit) }}"
        timeout: 120
        mode: "0640"
        validate_certs: "{{ ofm_validate_certs | default(true) }}"
        ca_path: "{{ ofm_ca_path | default(omit) }}"
      register: ofm_media_download
      until: ofm_media_download is succeeded
      retries: 3
      delay: 10
      when: >
        mediassource == 'webserver'

    - name: Unzip {{ stageDir }}/{{ javaInstallationFile }} to {{ stageDir }}
      ansible.builtin.unarchive:
        dest: "{{ stageDir }}"
        src: "{{ stageDir }}/{{ javaInstallationFile }}"
        creates: "{{ stageDir }}/jdk{{ javaVersion }}_{{ javaRelease }}"
        remote_src: true

    - name: Move {{ stageDir }}/jdk{{ javaVersion }}_{{ javaRelease }} to {{ javaHome }}
      ansible.builtin.command: "mv {{ stageDir }}/jdk{{ javaVersion }}_{{ javaRelease }} {{ javaHome }}"
      changed_when: true

    - name: Post clean {{ stageDir }}/{{ javaInstallationFile }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ javaInstallationFile }}"
        state: absent
