##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
javaBaseVolume: "/u01"
javaVersion: "{{ ofm_software.java.version }}"
javaRelease: "{{ ofm_software.java.release }}"
javaInstallationFile: "{{ ofm_software.java.file }}"
javaInstallationFileChecksum: "{{ ofm_software.java.sha256 }}"
javaBaseHome: "{{ javaBaseVolume }}/oracle/product/{{ javaVersion }}/{{ javaRelease }}"
javaHome: "{{ javaBaseHome }}/jdk"
javaExecutable: "{{ javaHome }}/bin/java"
javaRequiredSpace: 1073741824

# Full checksum string, for example: "sha256:0123..."
# javaInstallationFileChecksum: ""
