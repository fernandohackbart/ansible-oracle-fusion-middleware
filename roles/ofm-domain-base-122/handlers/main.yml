---
- name: Restart the AdminServer
  ansible.builtin.shell: |
    {{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}
    {{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-startAdminServer-{{ ofmAdminserverName }}
  args:
    executable: /bin/bash
  changed_when: true
  listen: restart admin server

- name: Restart the NodeManager
  ansible.builtin.shell: |
    {{ ofmDomainHome }}/bin/stopNodeManager.sh || true
    {{ ofmDomainHome }}/bin/startNodeManager.sh
  args:
    executable: /bin/bash
  changed_when: true
  listen: restart nodemanager
