##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
ofm_require_domain_secrets: true
ofmDomainName: "XPTO001"
ofmLogHome: "/u01/oracle/log"
ofmDomainLogsHome: "{{ ofmLogHome }}/domains/{{ ofmDomainName }}"
ofmConfigHome: "/u01/oracle/config"
ofmConfigRequiredSpace: 5368709120
ofmDomainBase: "{{ ofmConfigHome }}/domains"
ofmDomainHome: "{{ ofmDomainBase }}/{{ ofmDomainName }}"
ofmApplicationBase: "{{ ofmConfigHome }}/applications"
ofmApplicationHome: "{{ ofmApplicationBase }}/{{ ofmDomainName }}"
ofmTransactionsHome: "/u01/oracle/transaction"
ofmTransBase: "{{ ofmTransactionsHome }}/domains"
ofmTransHome: "{{ ofmTransBase }}/{{ ofmDomainName }}"
ofmDomainStageDir: "{{ stageDir }}/{{ ofmDomainName }}"

ofmRestrictedJRF: true
ofmRCUOperation: "createRepository"
ofmJdbcURLrcu: "server20.xpto.com:1521/daggpunkt.xpto.com"
ofmJdbcsysUsername: "sys"
ofmJDBCsysrole: "sysdba"
ofmJdbcsysPassword: ""
ofmJdbcRCUSchemaPrefix: "{{ ofmDomainName }}"
ofmJdbcRCUPassword: ""
ofmRCUComponents: "STB,IAU_APPEND,OPSS,IAU,MDS,WLS,IAU_VIEWER"
ofmNodemgrPort: "12000"
ofmNodemgrUsername: "{{ ofmDomainName }}NodeManager"
ofmNodemgrPassword: ""
ofmAdminserverName: "AdminServer"
ofmAdminserverPort: "12001"
ofmAdminservermsArsg: " -Xms700m -Xmx700m "
ofmUrandomArgs: " -Djava.security.egd=file:/dev/./urandom "
ofmAdminserverMachine: "{{ ofm_admin_fqdn | default(ansible_facts.fqdn | default(ansible_facts.hostname)) }}"
ofmAdminPassword: ""
ofmTemplateDomainName: "base_domain"
ofmTemplateJDBCPrefix: "DEV"
