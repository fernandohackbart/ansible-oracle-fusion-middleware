##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Assert required domain secrets are provided
  ansible.builtin.assert:
    that:
      - ofmAdminPassword | default('') | length > 0
      - ofmNodemgrPassword | default('') | length > 0
      - ofmJdbcRCUPassword | default('') | length > 0
      - ofmJdbcsysPassword | default('') | length > 0
      - ofmJdbcRCUSchemaPrefix | default('') | length > 0
    fail_msg: >-
      Provide the domain secrets through Ansible Vault or an external secret
      manager: ofmAdminPassword, ofmNodemgrPassword, ofmJdbcRCUPassword,
      ofmJdbcsysPassword. See inventories/example/group_vars/vault.yml.example.
    quiet: true
  no_log: true
  when: ofm_require_domain_secrets | default(true) | bool

- name: Check if OFM home {{ oraclePresenceFolder }} is already installed
  ansible.builtin.stat:
    path: "{{ oraclePresenceFolder }}"
  register: oracleHome_installed

- name: Check if OFM domain {{ ofmDomainName }} exists at {{ ofmDomainHome }}
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}"
  register: ofmDomainHome_configured

- name: Creating Oracle Fusion Middleware Infrastructure base domain defaults
  when: >
    oracleHome_installed.stat.exists and not ofmDomainHome_configured.stat.exists
  block:

    - name: Create stage folder "{{ stageDir }}"
      ansible.builtin.file:
        path: "{{ stageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create domain base folder {{ ofmDomainBase }}
      ansible.builtin.file:
        path: "{{ ofmDomainBase }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create application base folder {{ ofmApplicationBase }}
      ansible.builtin.file:
        path: "{{ ofmApplicationBase }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create transations base folder {{ ofmTransBase }}
      ansible.builtin.file:
        path: "{{ ofmTransBase }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create transations home folder {{ ofmTransHome }}
      ansible.builtin.file:
        path: "{{ ofmTransHome }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create logs home folder {{ ofmDomainLogsHome }}
      ansible.builtin.file:
        path: "{{ ofmDomainLogsHome }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create user home binaries folder {{ ofmInstallUserHomeDir }}/bin
      ansible.builtin.file:
        path: "{{ ofmInstallUserHomeDir }}/bin"
        state: directory
        mode: "{{ mode }}"

    - name: Pre clean {{ ofmDomainStageDir }}
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: absent
      when: >
        not ofmRestrictedJRF

    - name: Create domain stage directory {{ ofmDomainStageDir }}
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: directory
        mode: "{{ mode }}"
