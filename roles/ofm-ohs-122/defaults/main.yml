---
ofmInstallationMedia: "{{ ofm_software.ohs.archive }}"
ofmInstallationFile: "{{ ofm_software.ohs.installer }}"
ofmresponseFile: "{{ ofm_software.ohs.response_file }}"
ofmInstallationMediaChecksum: "{{ ofm_software.ohs.sha256 }}"
ofmInstallationInstallType: "Collocated HTTP Server (Managed through WebLogic server)"
oraclePresenceFolder: "{{ oracleHome }}/ohs"

# Full checksum string, for example: "sha256:0123..."
# ofmInstallationMediaChecksum: ""

# OHS is smaller than the Infrastructure baseline.
ofmInstallRequiredSpace: 4294967296
