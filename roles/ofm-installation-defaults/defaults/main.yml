##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
tempBaseVolume: "/tmp"
tempDir: "/tmp"
tempRequiredSpace: 5368709120

oraBaseVolume: "/u01"
oraBaseDir: "{{ oraBaseVolume }}/oracle/product"
ofmInstallRequiredSpace: 10737418240

oraInvPointer: "/etc/oraInst.loc"
orainvPointerTemplate: "oraInst.loc"
oraInvDir: "/u01/oraInventory"

ofmModule: "ofm"

# Software catalog. Replace REPLACE placeholders with the licensed media names
# and SHA256 checksums for the target release before running an installation.
ofm_software_catalog:
  "12.2.1.2":
    version: "12.2.1.2"
    rcu_version: "12.2.1.2.0"
    java:
      version: "1.8.0"
      release: "101"
      file: "jdk-8u101-linux-x64.tar.gz"
      sha256: ""
    infrastructure:
      archive: "V779122-01.zip"
      installer: "fmw_12.2.1.2.0_infrastructure.jar"
      response_file: "OFMAPP-12.2.1.2-install.rsp"
      sha256: ""
    forms:
      archive: "V789399-01.zip"
      installer: "fmw_12.2.1.2.0_fr_linux64.bin"
      response_file: "OFMWEB-12.2.1.2-install.rsp"
      sha256: ""
    ohs:
      archive: "V789368-01.zip"
      installer: "fmw_12.2.1.2.0_ohs_linux64.bin"
      response_file: "OFMWEB-12.2.1.2-install.rsp"
      sha256: ""
  "12.2.1.4":
    version: "12.2.1.4"
    rcu_version: "12.2.1.4.0"
    java:
      version: "1.8.0"
      release: "REPLACE"
      file: "jdk-8uREPLACE-linux-x64.tar.gz"
      sha256: ""
    infrastructure:
      archive: "REPLACE-infrastructure.zip"
      installer: "fmw_12.2.1.4.0_infrastructure.jar"
      response_file: "OFMAPP-12.2.1.4-install.rsp"
      sha256: ""
    forms:
      archive: "REPLACE-forms.zip"
      installer: "fmw_12.2.1.4.0_fr_linux64.bin"
      response_file: "OFMWEB-12.2.1.4-install.rsp"
      sha256: ""
    ohs:
      archive: "REPLACE-ohs.zip"
      installer: "fmw_12.2.1.4.0_ohs_linux64.bin"
      response_file: "OFMWEB-12.2.1.4-install.rsp"
      sha256: ""
  "14.1.2":
    version: "14.1.2"
    rcu_version: "14.1.2.0.0"
    java:
      version: "17.0"
      release: "0.12"
      file: "jdk-17.0.12_linux-x64_bin.tar.gz"
      sha256: ""
    infrastructure:
      archive: "REPLACE-infrastructure.zip"
      installer: "fmw_14.1.2.0.0_infrastructure.jar"
      response_file: "OFMAPP-14.1.2-install.rsp"
      sha256: ""
    forms:
      archive: "REPLACE-forms.zip"
      installer: "fmw_14.1.2.0.0_fr_linux64.bin"
      response_file: "OFMWEB-14.1.2-install.rsp"
      sha256: ""
    ohs:
      archive: "REPLACE-ohs.zip"
      installer: "fmw_14.1.2.0.0_ohs_linux64.bin"
      response_file: "OFMWEB-14.1.2-install.rsp"
      sha256: ""

ofm_release: "12.2.1.2"
ofm_software: "{{ ofm_software_catalog[ofm_release] }}"
ofmVersion: "{{ ofm_software.version }}"
oracleHome: "{{ oraBaseDir }}/{{ ofmVersion }}/{{ ofmModule }}"
oraclePresenceFolder: "{{ oracleHome }}"

# Download and installer policy.
ofm_validate_certs: true
# ofm_ca_path: /etc/pki/tls/certs/internal-ca.pem
ofm_decline_security_updates: true
ofm_decline_auto_updates: true
ofm_ignore_sys_prereqs: false

# Destructive-operation guards. These are intentionally false by default.
ofm_confirm_destroy: false
ofm_confirm_destroy_prod: false
ofm_require_domain_backup: true

# Controller-side domain artifact repository.
ofm_artifacts_dir: "{{ playbook_dir }}/artifacts"
ofm_domain_artifact_dir: >-
  {{ ofm_artifacts_dir }}/{{ (groups['ofm_admin'] | default([]) | first) | default(inventory_hostname) }}
