##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Checking serverEnvironment = {{ serverEnvironment }}
  ansible.builtin.fail:
    msg: "serverEnvironment = {{ serverEnvironment }} not valid!"
  when: >
    ((not (serverEnvironment in highenvs)) and (not(serverEnvironment in lowenvs)))

- name: Check if OFM home {{ oraclePresenceFolder }} is already installed
  ansible.builtin.stat:
    path: "{{ oraclePresenceFolder }}"
  register: oracleHome_installed

- name: Installing Oracle Fusion Middleware Infrastructure
  when: >
    not oracleHome_installed.stat.exists
  block:
    - name: Find the mount for {{ tempBaseVolume }}
      ansible.builtin.set_fact:
        ofm_temp_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', tempBaseVolume) | list | first | default({}) }}"

    - name: Assert sufficient space on {{ tempBaseVolume }}
      ansible.builtin.assert:
        that:
          - ofm_temp_mount | length > 0
          - ofm_temp_mount.size_available | default(0) > tempRequiredSpace
        fail_msg: >-
          Mount {{ tempBaseVolume }} was not found or has less than
          {{ tempRequiredSpace }} bytes available.
        quiet: true

    - name: Find the mount for {{ oraBaseVolume }}
      ansible.builtin.set_fact:
        ofm_install_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', oraBaseVolume) | list | first | default({}) }}"

    - name: Assert sufficient space on {{ oraBaseVolume }}
      ansible.builtin.assert:
        that:
          - ofm_install_mount | length > 0
          - ofm_install_mount.size_available | default(0) > ofmInstallRequiredSpace
        fail_msg: >-
          Mount {{ oraBaseVolume }} was not found or has less than
          {{ ofmInstallRequiredSpace }} bytes available.
        quiet: true

    - name: Create base folder {{ oraBaseDir }}
      ansible.builtin.file:
        path: "{{ oraBaseDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create stage folder "{{ stageDir }}"
      ansible.builtin.file:
        path: "{{ stageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create response file {{ stageDir }}/{{ ofmresponseFile }}
      ansible.builtin.template:
        src: "{{ ofmresponseFile }}"
        dest: "{{ stageDir }}/{{ ofmresponseFile }}"

    - name: Pre clean {{ stageDir }}/{{ ofmInstallationFile }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ ofmInstallationFile }}"
        state: absent

    - name: Download Oracle Fusion Middleware Infrastructure from {{ mediasURL }}/{{ ofmInstallationMedia }} to {{ stageDir }}/{{ ofmInstallationMedia }}
      ansible.builtin.get_url:
        url: "{{ mediasURL }}/{{ ofmInstallationMedia }}"
        dest: "{{ stageDir }}/{{ ofmInstallationMedia }}"
        checksum: "{{ ofmInstallationMediaChecksum | default(omit, true) }}"
        timeout: 120
        mode: "0640"
        validate_certs: "{{ ofm_validate_certs | default(true) }}"
        ca_path: "{{ ofm_ca_path | default(omit, true) }}"
      register: ofm_media_download
      until: ofm_media_download is succeeded
      retries: 3
      delay: 10
      when: >
        mediassource == 'webserver'

    - name: Unzip {{ stageDir }}/{{ ofmInstallationMedia }} to {{ stageDir }}
      ansible.builtin.unarchive:
        dest: "{{ stageDir }}"
        src: "{{ stageDir }}/{{ ofmInstallationMedia }}"
        creates: "{{ stageDir }}/{{ ofmInstallationFile }}"
        remote_src: true

    - name: Removing installation media {{ stageDir }}/{{ ofmInstallationMedia }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ ofmInstallationMedia }}"
        state: absent

    - name: Installing Oracle Fusion Middleware {{ ofmVersion }} on {{ oracleHome }}
      ansible.builtin.command: "{{ javaExecutable }} -jar {{ stageDir }}/{{ ofmInstallationFile }} -silent -responseFile {{ stageDir }}/{{ ofmresponseFile }}"
      changed_when: true
      environment:
        JAVA_HOME: "{{ javaHome }}"

    - name: Record the infrastructure installation marker
      ansible.builtin.copy:
        dest: "{{ oracleHome }}/.ofm-install-infrastructure.json"
        content: "{{ {'product': 'infrastructure', 'version': ofmVersion, 'media_checksum': ofmInstallationMediaChecksum | default(''), 'installed_at': ansible_facts.date_time.iso8601} | to_nice_json }}\n"
        mode: "0644"

    - name: Post clean {{ stageDir }}/{{ ofmInstallationFile }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ ofmInstallationFile }}"
        state: absent

    - name: Post clean {{ stageDir }}/{{ ofmresponseFile }}
      ansible.builtin.file:
        path: "{{ stageDir }}/{{ ofmresponseFile }}"
        state: absent
