- name: Clean {{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}.py
  ansible.builtin.file:
    path: "{{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}.py"
    state: absent
