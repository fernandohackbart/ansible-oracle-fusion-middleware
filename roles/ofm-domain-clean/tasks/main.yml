##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Assert destructive clean is explicitly confirmed
  ansible.builtin.assert:
    that:
      - ofm_confirm_destroy | default(false) | bool
      - ofm_environment not in ['ppe', 'prod'] or ofm_confirm_destroy_prod | default(false) | bool
    fail_msg: >-
      Refusing to clean the domain. Set ofm_confirm_destroy=true. For ppe/prod,
      also set ofm_confirm_destroy_prod=true.
    quiet: true

- name: Check for a packed domain backup
  ansible.builtin.stat:
    path: "{{ ofmDomainStageDir }}/Pack-{{ ofmDomainName }}.jar"
  register: ofm_domain_backup

- name: Assert a domain backup exists before cleaning
  ansible.builtin.assert:
    that: ofm_domain_backup.stat.exists
    fail_msg: >-
      No packed domain found at {{ ofmDomainStageDir }}/Pack-{{ ofmDomainName }}.jar.
      Run OFM-domain-pack.yml first, or set ofm_require_domain_backup=false for a
      non-production environment.
    quiet: true
  when: ofm_require_domain_backup | default(true) | bool

- name: Check if the domain home exists
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}"
  register: ofm_domain_present

- name: Stop the domain gracefully
  ansible.builtin.command:
    cmd: "{{ ofmDomainHome }}/bin/stopWebLogic.sh"
    chdir: "{{ ofmDomainHome }}"
  environment:
    JAVA_HOME: "{{ javaHome }}"
    JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
    TEMP: "{{ tempDir }}"
  when: ofm_domain_present.stat.exists
  failed_when: false
  changed_when: false
  timeout: 120

- name: Terminate remaining WebLogic processes for this domain
  ansible.builtin.shell: >-
    pgrep -f "^java .*weblogic.RootDirectory={{ ofmDomainHome }}" | xargs -r kill -TERM
  when: ofm_domain_present.stat.exists
  changed_when: false
  failed_when: false

- name: Wait for WebLogic processes to exit
  ansible.builtin.command: >-
    pgrep -f "^java .*weblogic.RootDirectory={{ ofmDomainHome }}"
  register: ofm_remaining_processes
  until: ofm_remaining_processes.rc != 0
  retries: 6
  delay: 5
  when: ofm_domain_present.stat.exists
  changed_when: false
  failed_when: false

- name: Force terminate remaining WebLogic processes
  ansible.builtin.shell: >-
    pgrep -f "^java .*weblogic.RootDirectory={{ ofmDomainHome }}" | xargs -r kill -KILL
  when:
    - ofm_domain_present.stat.exists
    - (ofm_remaining_processes.rc | default(1)) == 0
  changed_when: false
  failed_when: false
####################################################################################################################################
# Run RCU to clean up the schemas
- name: Cleaning the RCU created repository
  when: >
    not ofmRestrictedJRF
  run_once: true

####################################################################################################################################

  block:

    - name: Create stage folder {{ ofmDomainStageDir }}
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create RCU response file {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}.rsp
      ansible.builtin.template:
        src: "RCU-{{ ofm_software.rcu_version }}-generic.rsp"
        dest: "{{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}.rsp"
        mode: "0600"

      no_log: true
    - name: Create RCU response file {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}-passwords.rsp
      ansible.builtin.template:
        src: "RCU-{{ ofm_software.rcu_version }}-passwords.rsp"
        dest: "{{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}-passwords.rsp"
        mode: "0600"

      no_log: true
    - name: Run RCU {{ ofmRCUOperation }} prefix {{ ofmJdbcRCUSchemaPrefix }} and components ({{ ofmRCUComponents }}) at {{ ofmJdbcURLrcu }}
      ansible.builtin.shell: >-
        {{ oracleHome }}/oracle_common/bin/rcu -silent
        -responseFile {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}.rsp
        -f < {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}-passwords.rsp
      no_log: true
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        ORACLE_HOME: "{{ oracleHome }}"
        TEMP: "{{ tempDir }}"

  always:
    - name: Post clean {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}.rsp
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}.rsp"
        state: absent

    - name: Post clean {{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}-passwords.rsp
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}/RCU-{{ ofm_software.rcu_version }}-{{ ofmDomainName }}-passwords.rsp"
        state: absent

- name: Clean {{ ofmDomainLogsHome }}
  ansible.builtin.file:
    path: "{{ ofmDomainLogsHome }}"
    state: absent

- name: Clean {{ ofmDomainHome }}
  ansible.builtin.file:
    path: "{{ ofmDomainHome }}"
