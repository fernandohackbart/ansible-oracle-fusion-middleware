- name: Clean {{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-startAdminServer-{{ ofmAdminserverName }}.py
  ansible.builtin.file:
    path: "{{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-startAdminServer-{{ ofmAdminserverName }}.py"
    state: absent

- name: Clean {{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}
  ansible.builtin.file:
    path: "{{ ofmInstallUserHomeDir }}/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}"
