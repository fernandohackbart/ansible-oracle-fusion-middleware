##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Checking serverEnvironment = {{ serverEnvironment }}
  ansible.builtin.fail:
    msg: "serverEnvironment = {{ serverEnvironment }} not valid!"
  when: >
    ((not (serverEnvironment in highenvs)) and (not(serverEnvironment in lowenvs)))

- name: Check if OFM domain {{ ofmDomainName }} exists at {{ ofmDomainHome }}
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}"
  register: ofmDomainHome_configured

- name: Creating new managed servers
  when: >
    ofmDomainHome_configured.stat.exists
  block:

    - name: Create stage folder "{{ ofmDomainStageDir }}"
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: directory
        mode: "{{ mode }}"

  ########################################################################################################################

    - name: Creating create managed servers Jython script {{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmMGDSRVextserverprefix }}{{ index }}.py
      ansible.builtin.template:
        src: "OFM-12.2-createManagedServer.py"
        dest: "{{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmMGDSRVextserverprefix }}{{ index }}.py"
        mode: "{{ mode }}"
      loop: "{{ ofmMGDSRVextmachines }}"
      loop_control:
        index_var: index

    - name: Creating managed servers {{ ofmDomainName }} with prefix {{ ofmMGDSRVextserverprefix }}
      ansible.builtin.command: "{{ oracleHome }}/oracle_common/common/bin/wlst.sh {{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmMGDSRVextserverprefix }}{{ index }}.py"
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"
      loop: "{{ ofmMGDSRVextmachines }}"
      loop_control:
        index_var: index

  ########################################################################################################################
