##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Assert Oracle home removal is explicitly confirmed
  ansible.builtin.assert:
    that:
      - ofm_confirm_destroy | default(false) | bool
      - ofm_environment not in ['ppe', 'prod'] or ofm_confirm_destroy_prod | default(false) | bool
    fail_msg: >-
      Refusing to remove the Oracle home. Set ofm_confirm_destroy=true. For
      ppe/prod, also set ofm_confirm_destroy_prod=true.
    quiet: true

- name: Checking serverEnvironment = {{ serverEnvironment }}
  ansible.builtin.fail:
    msg: "serverEnvironment = {{ serverEnvironment }} not valid!"
  when: >
    ((not (serverEnvironment in highenvs)) and (not(serverEnvironment in lowenvs)))

- name: Check if OFM home {{ oraclePresenceFolder }} is already installed
  ansible.builtin.stat:
    path: "{{ oraclePresenceFolder }}"
  register: oracleHome_installed

- name: Remove the Oracle Fusion Middleware installation
  when: oracleHome_installed.stat.exists
  block:
    - name: Detach Oracle Fusion Middleware {{ ofmVersion }} from the central inventory
      ansible.builtin.command: "{{ oracleHome }}/oui/bin/detachHome.sh"
      changed_when: true
      failed_when: false

    - name: Remove the Oracle home
      ansible.builtin.file:
        path: "{{ oracleHome }}"
        state: absent
