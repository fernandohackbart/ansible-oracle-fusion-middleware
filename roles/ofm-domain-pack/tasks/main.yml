##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Check if OFM domain {{ ofmDomainName }} exists at {{ ofmDomainHome }}
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}"
  register: ofmDomainHome_configured

- name: Pack the domain {{ ofmDomainName }}
  when: ofmDomainHome_configured.stat.exists
  block:
    - name: Ensure the domain stage directory exists
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Remove an old packed domain
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}/Pack-{{ ofmDomainName }}.jar"
        state: absent

    - name: Remove an old NodeManager archive
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}/{{ ofmDomainName }}-nodemanager.tgz"
        state: absent

    - name: Pack domain {{ ofmDomainName }} from {{ ofmDomainHome }}
      ansible.builtin.command: >-
        {{ oracleHome }}/oracle_common/common/bin/pack.sh
        -domain={{ ofmDomainHome }}
        -template={{ ofmDomainStageDir }}/Pack-{{ ofmDomainName }}.jar
        -template_name=Pack-{{ ofmDomainName }}
        -managed=true
        -log={{ ofmDomainLogsHome }}/Pack-{{ ofmDomainName }}.log
        -log_priority=info
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        ORACLE_HOME: "{{ oracleHome }}"
        TEMP: "{{ tempDir }}"

    - name: Archive the NodeManager home
      community.general.archive:
        path: "{{ ofmDomainHome }}/nodemanager"
        dest: "{{ ofmDomainStageDir }}/{{ ofmDomainName }}-nodemanager.tgz"
        format: gz
        mode: "0600"

    - name: Fetch the packed domain to the Ansible controller
      ansible.builtin.fetch:
        src: "{{ ofmDomainStageDir }}/Pack-{{ ofmDomainName }}.jar"
        dest: "{{ ofm_artifacts_dir }}/{{ inventory_hostname }}/"
        flat: true
      changed_when: true

    - name: Fetch the NodeManager archive to the Ansible controller
      ansible.builtin.fetch:
        src: "{{ ofmDomainStageDir }}/{{ ofmDomainName }}-nodemanager.tgz"
        dest: "{{ ofm_artifacts_dir }}/{{ inventory_hostname }}/"
        flat: true
      changed_when: true

    - name: Show the artifact location
      ansible.builtin.debug:
        msg: >-
          Domain artifacts are available at
          {{ ofm_artifacts_dir }}/{{ inventory_hostname }}/.
