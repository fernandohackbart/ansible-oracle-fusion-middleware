##################################################################################################################################
# Oracle Fusion Middleware 12.2 Infrastructure installation playbook
# Developed by Fernando Hackbart (fhackbart@gmail.com)
# Lisbon 2017-12-28
---
- name: Checking serverEnvironment = {{ serverEnvironment }}
  ansible.builtin.fail:
    msg: "serverEnvironment = {{ serverEnvironment }} not valid!"
  when: >
    ((not (serverEnvironment in highenvs)) and (not(serverEnvironment in lowenvs)))

- name: Check if OFM domain {{ ofmDomainName }} exists at {{ ofmDomainHome }}
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}"
  register: ofmDomainHome_configured

- name: Check whether the Forms extension marker exists
  ansible.builtin.stat:
    path: "{{ ofmDomainHome }}/.ofm-extended-forms"
  register: ofm_forms_extended

- name: Extending Oracle Fusion Middleware Infrastructure domain for Oracle Forms
  when: >
    ofmDomainHome_configured.stat.exists and not ofm_forms_extended.stat.exists
  block:

    - name: Create stage folder "{{ ofmDomainStageDir }}"
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}"
        state: directory
        mode: "{{ mode }}"

    - name: Create variables for restricted JRF extension
      ansible.builtin.set_fact:
        ofmFRMexttemplate: "Oracle Forms"
      when: >
        ofmRestrictedJRF

    - name: Create variables for non restricted JRF extension
      ansible.builtin.set_fact:
        ofmFRMexttemplate: "Oracle Forms"
      when: >
        not ofmRestrictedJRF

    - name: Assigning default value to ofmFRMextassignexistingserver
      ansible.builtin.set_fact:
        ofmFRMextassignexistingserver: ""

    - name: Check if the template requires a server to be assigned to
      ansible.builtin.set_fact:
        ofmFRMextassignexistingserver: "{{ ofmAdminserverName }}"
      when: >
        ofmFRMextrequireserver and not ofmFRMextprovideserver

    - name: Defined the server name for the template provided server {{ ofmFRMextserverprefix }}0
      ansible.builtin.set_fact:
        ofmFRMextservername: "{{ ofmFRMextserverprefix }}0"

    ########################################################################################################################
    - name: Stopping {{ ofmAdminserverName }} with {{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}
      ansible.builtin.command: "{{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-stopAdminServer-{{ ofmAdminserverName }}"
      changed_when: true
      args:
        chdir: "{{ ofmInstallUserHomeDir }}/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"

    - name: Create extend domain Jython script {{ ofmDomainStageDir }}/OFM-12.2-extendDomain-FRM.py
      ignore_errors: true
      ansible.builtin.template:
        src: "OFM-12.2-extendDomain-FRM.py"
        dest: "{{ ofmDomainStageDir }}/OFM-12.2-extendDomain-FRM.py"
        mode: "{{ mode }}"

    - name: Create move filestores Jython script {{ ofmDomainStageDir }}/OFM-12.2-moveFileStoresToConfig.py
      ansible.builtin.template:
        src: "OFM-12.2-moveFileStoresToConfig.py"
        dest: "{{ ofmDomainStageDir }}/OFM-12.2-moveFileStoresToConfig.py"
        mode: "{{ mode }}"

    - name: Extending {{ ofmDomainName }} with {{ ofmFRMexttemplate  }}
      ansible.builtin.command: "{{ oracleHome }}/oracle_common/common/bin/wlst.sh {{ ofmDomainStageDir }}/OFM-12.2-extendDomain-FRM.py"
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"

  ########################################################################################################################

    - name: Creating create managed servers Jython script {{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py
      ansible.builtin.template:
        src: "OFM-12.2-createManagedServer.py"
        dest: "{{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py"
        mode: "{{ mode }}"
      when: >
        index > 0
      loop: "{{ ofmFRMextmachines }}"
      loop_control:
        index_var: index

    - name: Creating managed servers {{ ofmDomainName }} with {{ ofmFRMexttemplate  }}
      ansible.builtin.command: "{{ oracleHome }}/oracle_common/common/bin/wlst.sh {{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py"
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"
      when: >
        index > 0
      loop: "{{ ofmFRMextmachines }}"
      loop_control:
        index_var: index

    ########################################################################################################################
    - name: Starting {{ ofmAdminserverName }} with {{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-startAdminServer-{{ ofmAdminserverName }}
      ansible.builtin.command: "{{ ofmInstallUserHomeDir }}/bin/{{ ofmDomainName }}-startAdminServer-{{ ofmAdminserverName }}"
      changed_when: true
      args:
        chdir: "{{ ofmInstallUserHomeDir }}/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"

  ########################################################################################################################

    - name: Creating adjust managed servers Jython script {{ ofmDomainStageDir }}/OFM-12.2-createManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py
      ansible.builtin.template:
        src: "OFM-12.2-adjustManagedServer.py"
        dest: "{{ ofmDomainStageDir }}/OFM-12.2-adjustManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py"
        mode: "{{ mode }}"
      loop: "{{ ofmFRMextmachines }}"
      loop_control:
        index_var: index

    - name: Adjusting managed servers {{ ofmDomainName }} with {{ ofmFRMexttemplate  }}
      ansible.builtin.command: "{{ oracleHome }}/oracle_common/common/bin/wlst.sh {{ ofmDomainStageDir }}/OFM-12.2-adjustManagedServer-{{ ofmFRMextserverprefix }}{{ index }}.py"
      changed_when: true
      args:
        chdir: "{{ oracleHome }}/oracle_common/common/bin"
      environment:
        JAVA_HOME: "{{ javaHome }}"
        JAVA_OPTIONS: "{{ ofmUrandomArgs }}"
        TEMP: "{{ tempDir }}"
      loop: "{{ ofmFRMextmachines }}"
      loop_control:
        index_var: index

    ########################################################################################################################
    - name: Clean {{ ofmDomainStageDir }}/OFM-12.2-extendDomain-FRM.py
      ansible.builtin.file:
        path: "{{ ofmDomainStageDir }}/OFM-12.2-extendDomain-FRM.py"
        state: absent

    - name: Record the Forms extension marker
      ansible.builtin.copy:
        dest: "{{ ofmDomainHome }}/.ofm-extended-forms"
        content: "{{ {'extension': 'forms', 'version': ofmVersion, 'extended_at': ansible_facts.date_time.iso8601} | to_nice_json }}\n"
        mode: "0644"

  ########################################################################################################################
